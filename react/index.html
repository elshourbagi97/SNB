<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Correct stylesheet link -->
    <link rel="stylesheet" href="/src/assets/css/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SNB Bank</title>
    <style>
      /* Remove forced full-screen from inner containers */
      
      .max-w-7xl.mx-auto,
      .max-w-4xl.mx-auto,
      .max-w-7xl.mx-auto.mt-20,
      .max-w-7xl.mx-auto.mt-28 {
        min-height: auto; /* let content define height */
      }

      .fullcontainer {
        min-height: auto;
        /* margin-top: 5%; adjust as needed */
        height: 100%;
      }

      .containerQuestionChoose {
        height: auto !important; /* no forced 100% */
      }

      /* Page wrapper */
      .firstStep {
        display: flex;
        flex-direction: column;
        min-height: 100vh; /* page fills screen */
        overflow: hidden;
      }

      .firstStep footer {
        margin-top: auto; /* footer stays at bottom */
        /* position: relative !important; */
      }
.desktop-message {
  display: none;
}

      /* On desktop only */
      @media (min-width: 1024px) {
        body {
          margin: 0;
          background: #f5f5f5;
          display: flex;
          justify-content: center;
          align-items: flex-start;
          min-height: 100vh;
        }

        /* Force app into mobile frame on ALL wide screens */
        .mobileframe {
          width: 100%;
          max-width: 430px; /* phone width */
          min-height: 100vh;
          background: #fff;
          box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
          overflow-y: auto;
          border-radius: 20px;
          display: flex;
          flex-direction: column;
        }

        /* footer inside each page */
        .footer {
          padding: 15px;
          background: #f1f1f1;
          text-align: center;
        }

        .containerQuestionChoose {
          min-height: auto !important; /* prevent forced height */
        }
      }
    </style>
  </head>

  <body>
    <div id="root" class="mobileframe">
      <p class="desktop-message">For the best experience, please open this on your phone 📱</p>

    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
