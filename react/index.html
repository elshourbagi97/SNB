  <style>
    .max-w-7xl.mx-auto,
.max-w-4xl.mx-auto,
.max-w-7xl.mx-auto.mt-20,
.max-w-7xl.mx-auto.mt-28 {
  min-height: 100vh;
  background-color: #008787;
}

.fullcontainer {
  min-height: auto; /* safer than fit-content */
}

.containerQuestionChoose {
  height: 100% !important;
}

.firstStep {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  overflow-y: auto;
}

.firstStep footer {
  margin-top: auto;
  position: relative !important;
}

/* On desktop only */
@media (min-width: 760px) {
  body {
    margin: 0;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  /* Force app into mobile frame on ALL screens */
  .mobileframe {
    width: 100%;
    max-width: 430px; /* phone width */
    min-height: 100vh;
    background: #fff;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
    overflow-y: auto;
    border-radius: 20px;
  }

  /* footer inside each page */
  .footer {
    padding: 15px;
    background: #f1f1f1;
    text-align: center;
  }

  .containerQuestionChoose {
    min-height: 100vh !important;
  }
}

  </style>
